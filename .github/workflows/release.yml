name: Release Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust core tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: "qtshadertools"

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Setup .NET and WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build Windows MSI
        shell: pwsh
        run: |
          $ver = "0.2.0"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)') {
            $ver = $Matches[1]
          }
          ./package/windows/build-msi.ps1 -Version $ver

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nulla-windows-msi
          path: dist/*.msi
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libegl-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust core tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"
          modules: "qtshadertools"

      - name: Build Linux binary archive
        shell: bash
        run: |
          set -euo pipefail
          ver="0.2.0"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [[ "${GITHUB_REF_NAME:-}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            ver="${BASH_REMATCH[1]}"
          fi
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --parallel
          stage="dist/nulla-${ver}-linux-x86_64"
          rm -rf "$stage"
          mkdir -p "$stage/assets"
          cp build-linux/nulla "$stage/nulla"
          strip "$stage/nulla"
          cp assets/nulla.desktop assets/nulla.svg assets/nulla.png "$stage/assets/"
          cp LICENSE "$stage/LICENSE"
          tar -C dist -czf "dist/nulla-${ver}-linux-x86_64.tar.gz" "nulla-${ver}-linux-x86_64"
          (cd dist && sha256sum "nulla-${ver}-linux-x86_64.tar.gz" > "nulla-${ver}-linux-x86_64.tar.gz.sha256")
          rm -rf "$stage"

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nulla-linux-bin
          path: |
            dist/nulla-*-linux-x86_64.tar.gz
            dist/nulla-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
