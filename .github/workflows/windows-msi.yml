name: Windows MSI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: "qtshadertools"

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Setup .NET and WiX
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build Windows MSI
        shell: pwsh
        run: |
          $ver = "0.2.0"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)') {
            $ver = $Matches[1]
          }
          ./package/windows/build-msi.ps1 -Version $ver

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nulla-windows-msi
          path: dist/*.msi
          if-no-files-found: error

      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
